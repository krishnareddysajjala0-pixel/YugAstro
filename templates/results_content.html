    <!-- Loading Overlay -->
    <div id="loading-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:10000; flex-direction:column; align-items:center; justify-content:center;">
        <div style="width:50px; height:50px; border:5px solid rgba(255,255,255,0.1); border-top:5px solid #ffd700; border-radius:50%; animation:spin 1s linear infinite;"></div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
        <div style="margin-top:20px; color:#ffd700; font-weight:bold; font-size:18px;">{{ _('గణన చేస్తోంది') }}</div>
    </div>

    <script>
        function setTheme(themeName) {
            if (themeName === 'default') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', themeName);
            }
            localStorage.setItem('preferred-theme', themeName);

            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-theme-btn') === themeName) {
                    btn.classList.add('active');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('preferred-theme') || 'light';
            document.querySelectorAll('.theme-btn').forEach(btn => {
                if (btn.getAttribute('data-theme-btn') === savedTheme) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        });

        function playLoadingSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let time = audioCtx.currentTime;
                for(let i = 0; i < 6; i++) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = i % 2 === 0 ? 'sine' : 'triangle';
                    osc.frequency.setValueAtTime(440 + (i * 80), time);
                    gain.gain.setValueAtTime(0, time);
                    gain.gain.linearRampToValueAtTime(0.04, time + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(time);
                    osc.stop(time + 0.4);
                    time += 0.25;
                }
            } catch (e) {}
        }

        function startTyping() {
            const element = document.getElementById("typing-text");
            if (!element) return;
            element.innerHTML = '{{ _('గణన చేస్తోంది') }}';
        }

        

        function showLoader() {
            playLoadingSound();
            document.getElementById('loading-overlay').style.display = 'flex';
            startTyping();
        }

        document.querySelectorAll('.float-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const href = this.getAttribute('onclick')?.match(/'([^']+)'/)?.[1];
                if(href && href !== '#' && !href.startsWith('javascript:')) {
                    e.preventDefault();
                    showLoader();
                    window.location.href = href;
                }
            });
        });
    </script>
