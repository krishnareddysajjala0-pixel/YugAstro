<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="rubyGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="85%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>
    <linearGradient id="rubyFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="rubyFacet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
  </defs>
  <!-- Base Gem Silhouette (Octagon / Cushion Cut) -->
  <polygon points="15,4 33,4 44,15 44,33 33,44 15,44 4,33 4,15" fill="url(#rubyGlow)" stroke="#f43f5e" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Crown / Facets -->
  <polygon points="18,12 30,12 36,18 36,30 30,36 18,36 12,30 12,18" fill="#be123c" stroke="#fb7185" stroke-width="1"/>
  <!-- Table facet (Center) -->
  <polygon points="20,16 28,16 32,20 32,28 28,32 20,32 16,28 16,20" fill="url(#rubyFacet1)"/>
  <!-- Corner facets -->
  <polygon points="15,4 20,16 16,20 4,15" fill="#f43f5e" opacity="0.6"/>
  <polygon points="33,4 28,16 32,20 44,15" fill="#9f1239" opacity="0.7"/>
  <polygon points="44,33 32,28 36,30 33,44" fill="#4c0519" opacity="0.8"/>
  <polygon points="4,33 16,28 12,30 15,44" fill="#881337" opacity="0.7"/>
  <!-- Light sparkle highlight -->
  <circle cx="22" cy="18" r="2.5" fill="#ffffff" opacity="0.85"/>
</svg>