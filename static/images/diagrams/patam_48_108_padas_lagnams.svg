    <rect x="45" y="345" width="140" height="120" fill="rgba(30,41,59,0.8)" stroke="#334155" rx="6"/>
    <text x="115" y="365" font-size="15" font-weight="bold" fill="#a855f7" text-anchor="middle">ధనస్సు (9 పాదాలు)</text>
